# West cluster workloads for the multicluster example.
#
# West is the exported side. It holds a real "other" service plus two
# exported carrier Services that set discovery metadata east will honor
# when it mirrors them. The carriers point discovery away from "other".
apiVersion: v1
kind: Namespace
metadata:
  name: tenant
  annotations:
    linkerd.io/inject: enabled
---
# Distinct identity for other, so mTLS shows other-sa.tenant, not default.tenant.
#
# As on east, a named account makes the backend that actually answers
# legible in the proxy metrics instead of an anonymous default identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: other-sa
  namespace: tenant
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: other-html
  namespace: tenant
data:
  index.html: "I-AM-WEST-OTHER\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: other
  namespace: tenant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: other
  template:
    metadata:
      labels:
        app: other
    spec:
      serviceAccountName: other-sa
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: other-html
---
apiVersion: v1
kind: Service
metadata:
  name: other
  namespace: tenant
spec:
  selector:
    app: other
  ports:
    - port: 80
      targetPort: 80
---
# Carrier A: exported with a local-discovery annotation and no backends.
#
# The exported label makes east mirror it as evil-west; the annotation
# tells east to resolve it against a local service named "victim", so a
# name under this tenant's control decides where the mirror lands. Its own
# selector matches nothing, proving the resolution comes from the
# annotation and not from any pod here.
apiVersion: v1
kind: Service
metadata:
  name: evil
  namespace: tenant
  labels:
    mirror.linkerd.io/exported: "true"
  annotations:
    multicluster.linkerd.io/local-discovery: "victim"
spec:
  selector:
    app: nonexistent
  ports:
    - port: 80
      targetPort: 80
---
# Carrier B: exported with remote-discovery/remote-service labels, no annotations.
#
# The label variant of the same redirect: east mirrors it as gwhijack-west
# and the remote-discovery/remote-service labels steer its resolution to
# the named target rather than to this carrier's (empty) selector.
apiVersion: v1
kind: Service
metadata:
  name: gwhijack
  namespace: tenant
  labels:
    mirror.linkerd.io/exported: "true"
    multicluster.linkerd.io/remote-discovery: "west"
    multicluster.linkerd.io/remote-service: "other"
spec:
  selector:
    app: nonexistent
  ports:
    - port: 80
      targetPort: 80
