# Deployment load in ns demo: one meshed fortio client holding ~2000 long-lived connections to echo.demo:5678.
# 500 req/s total; -connection-reuse reopens each connection after 50-150 requests (~3-10 min).
# -sequential-warmup opens connections one at a time so the proxy's 128-entry listen backlog does not overflow.
# test_load_3_fortio.sh substitutes the -c and -qps values; init_9_deploy_echo.sh creates ns demo and echo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
  namespace: demo
  labels:
    app: load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load
  template:
    metadata:
      labels:
        app: load
    spec:
      containers:
        - name: load
          image: fortio/fortio:1.75.3
          args:
            - load
            - -c
            - "2000"
            - -qps
            - "500"
            - -t
            - "0"
            - -uniform
            - -sequential-warmup
            - -connection-reuse
            - "50:150"
            - -allow-initial-errors
            - -loglevel
            - warning
            - http://echo.demo:5678/
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
