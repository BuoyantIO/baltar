# Deployment load: one meshed fortio client holding many long-lived connections to the target URL.
# -connection-reuse reopens each connection after 50-150 requests (~3-10 min at the script defaults).
# -sequential-warmup opens connections one at a time so the proxy's 128-entry listen backlog does not overflow.
# test_load_3_fortio.sh fills the <..._PLACEHOLDER> values and applies it with -n NAMESPACE.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
  labels:
    app: load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load
  template:
    metadata:
      labels:
        app: load
    spec:
      containers:
        - name: load
          image: fortio/fortio:1.75.3
          args:
            - load
            - -c
            - "<CONNECTIONS_PLACEHOLDER>"
            - -qps
            - "<QPS_PLACEHOLDER>"
            - -t
            - "0"
            - -uniform
            - -sequential-warmup
            - -connection-reuse
            - "50:150"
            - -allow-initial-errors
            - -loglevel
            - warning
            - "<TARGET_URL_PLACEHOLDER>"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
